name: Build Windows VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.10
          path: JUCE

      - name: Configure plugin
        shell: pwsh
        run: |
          cmake -S "adaptive_mix_engine_v0_9_windows_build_source (1)" -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build plugin
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AdaptiveMixStereo-Windows-VST3
          path: build/AdaptiveMixStereo_artefacts/Release/VST3/**
          if-no-files-found: error
